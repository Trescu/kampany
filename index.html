  <template id="story-campaign"><p class="story-kicker">01 / A KAMPÁNYRÓL</p>
<h3>Nem egy szokványos kampány</h3>
<p>Nem akartam egy újabb sablonos választási oldalt. A GTA IV hangulatú képek egy kicsit más megközelítést adnak a kampánynak, de ami mögöttük van, azt komolyan gondolom.</p>
<p>Olyan hallgatói önkormányzatot szeretnék, amely nemcsak választások idején látható. Fontosnak tartom, hogy a hallgatók tudják, kihez fordulhatnak, hogyan tehetnek javaslatot, és mi történik az általuk jelzett problémákkal.</p>
<p>A célom nem az, hogy mindenre kész megoldást ígérjek. Inkább az, hogy a felmerülő kérdéseknek legyen gazdája, az ügyeknek legyen követhető útja, és a döntésekről érthető visszajelzés érkezzen.</p>
<h4>Miről szól ez a kampány?</h4>
<ul>
<li>Elérhetőbb és átláthatóbb hallgatói képviseletről.</li>
<li>Egyszerűbb, digitális megoldások lehetőségéről.</li>
<li>Arról, hogy a hallgatók véleménye valóban eljusson a megfelelő helyre.</li>
</ul></template>
<template id="story-university"><p class="story-kicker">02 / MIÉRT INDULOK?</p>
<h3>Problémák helyett megoldásokat keresek</h3>
<p>A Gábor Dénes Egyetem mérnökinformatikus hallgatójaként a mindennapjaim része, hogy rendszereket tervezek, fejlesztek, és megpróbálom megtalálni, hol lehet egy folyamatot egyszerűbbé tenni. Ezt a szemléletet szeretném a hallgatói képviseletbe is átvinni.</p>
<p>Szerintem egy jó HÖK-nek nemcsak programokat kell szerveznie. Ugyanilyen fontos a tájékoztatás, a hallgatói kérdések kezelése és az, hogy a felvetett problémák ne tűnjenek el válasz nélkül.</p>
<p>Nem állítom, hogy minden ügyre tudom a megoldást, és azt sem, hogy mindent egyedül meg lehet változtatni. Azt viszont vállalni szeretném, hogy utánajárjak a kérdéseknek, keressem az együttműködés lehetőségét, és világosan kommunikáljam, meddig jutottunk.</p>
<h4>Amiben hiszek</h4>
<p>Kevesebb felesleges kör, több érthető információ, és olyan képviselet, amelyben a hallgatók nem csak a választás napján számítanak.</p></template>
<template id="story-digital"><p class="story-kicker">03 / ÖTLETEK ÉS JAVASLATOK</p>
<h3>Ötleteljünk együtt!</h3>
<p>A jó ötletek nem feltétlenül egy megbeszélésen születnek meg. Lehet, hogy éppen te találkozol nap mint nap egy olyan nehézséggel, amelyet mások észre sem vesznek.</p>
<p>Ezért szeretném, ha a hallgatóknak egyszerű módjuk lenne kérdezni, javasolni vagy jelezni valamit. Nem kell minden gondolatra azonnali megoldást ígérni, de fontos, hogy az érdemi felvetések ne vesszenek el, és legyen rájuk visszajelzés.</p>
<p>A célom egy nyitottabb párbeszéd kialakítása: ahol az ötleteket meg lehet beszélni, a megvalósítható javaslatokat tovább lehet vinni, és a korlátokról is őszintén lehet beszélni.</p>
<h4>Hogyan képzelem el?</h4>
<ul>
<li>Könnyen elérhető hallgatói visszajelzési lehetőség.</li>
<li>Akár névtelen javaslatok és észrevételek fogadása.</li>
<li>Érthető tájékoztatás arról, mi történt egy felvetett üggyel.</li>
</ul>
<p>Ezek jelenleg tervek. A részleteket éppen azokkal szeretném kialakítani, akik használni fogják őket: veletek.</p></template>
<template id="story-dialogue"><p class="story-kicker">04 / HALLGATÓI KÖZÖSSÉG</p>
<h3>Az egyetem több, mint az órarend</h3>
<p>A hallgatói élet nem ér véget az előadásokkal, a beadandókkal és a vizsgákkal. Az is számít, milyen könnyű kapcsolatot találni egymással, információt cserélni, vagy bekapcsolódni az egyetem közösségébe.</p>
<p>Számomra fontos, hogy ez ne csak azoknak legyen lehetőség, akik minden nap személyesen az egyetemen vannak. A munka mellett tanuló, levelezős vagy főként online jelen lévő hallgatóknak is legyen módjuk részt venni, véleményt mondani és kapcsolódni.</p>
<p>Nem az a célom, hogy mindenáron minél több rendezvény legyen. Inkább olyan kezdeményezésekben gondolkodom, amelyekre tényleg van igény: szakmai beszélgetésekben, tapasztalatcserében, hasznos közös programokban és könnyebben elérhető információkban.</p>
<h4>Mitől lenne jobb?</h4>
<p>Ha a programok és kezdeményezések nem felülről eldöntött ötletek lennének, hanem a hallgatói visszajelzésekből indulnának ki.</p></template>
<template id="story-priorities"><p class="story-kicker">05 / FÓKUSZBAN A CÉL</p>
<h3>eHÖK: átláthatóbb hallgatói ügyek</h3>
<p>Az egyik legfontosabb fejlesztési elképzelésem az eHÖK: egy olyan digitális felület, amely egyszerűbbé tehetné a hallgatói önkormányzat és a hallgatók közötti kommunikációt.</p>
<p>A koncepció szerint egy hallgató javaslatot, kérdést vagy problémát küldhetne be, akár név nélkül is. A bejelentés kapna egy követhető állapotot, így nem kellene találgatni, hogy megérkezett-e, foglalkozik-e vele valaki, vagy lezárult az ügy.</p>
<p>Ez még nem kész szolgáltatás, hanem egy fejlesztési irány. A megvalósítást az egyetem és a hallgatói képviselet tényleges igényeihez, valamint a szükséges adatvédelmi és működési feltételekhez kell igazítani.</p>
<h4>Az elsőként megvalósítandó célok</h4>
<ul>
<li>Egyszerű bejelentés és visszajelzés, felesleges adminisztráció nélkül.</li>
<li>Ügyállapot-követés a hallgatók számára.</li>
<li>Áttekinthetőbb tájékoztatás a felmerülő kérdésekről és megoldásokról.</li>
</ul>
<p>Nem egy újabb bonyolult rendszert szeretnék, hanem egy olyan eszközt, amelyet érdemes lenne használni.</p></template>
