  <template id="story-campaign"><p class="story-kicker">01 / A KAMPÁNYRÓL</p>
<h3>Egy elérhetőbb HÖK-ért</h3>
<p>Szerintem a hallgatói képviselet akkor működik jól, ha tudod, kihez fordulhatsz, amikor kérdésed vagy problémád van. És azzal sem érhet véget egy ügy, hogy elküldted az üzenetedet.</p>
<p>Olyan működésen szeretnék dolgozni, ahol érthetőbb a tájékoztatás, egyszerűbb a kapcsolatfelvétel, és követhető, mi történik egy bejelentéssel vagy javaslattal.</p>
<p>Ezért indulok a HÖK-be. Vannak konkrét fejlesztési elképzeléseim, de először azt is szeretném megérteni, hogy a hallgatóknak mire lenne valóban szükségük.</p></template>
<template id="story-university"><p class="story-kicker">02 / BEMUTATKOZÁS</p>
<h3>Miért indulok?</h3>
<p>A Gábor Dénes Egyetemen tanulok mérnökinformatikát. A fejlesztésben az érdekel a legjobban, hogyan lehet egy bonyolult folyamatot egyszerűbbé és használhatóbbá tenni.</p>
<p>A hallgatói ügyeknél is ezt keresném. Hol akad el az információ? Miért kell ugyanazt többször megkérdezni? Hogyan lehetne gyorsabban eljutni a megfelelő emberhez?</p>
<p>Szeretnék részt venni abban, hogy ezekre a kérdésekre gyakorlati válaszok szülessenek. Nem feltétlenül minden problémára egy új alkalmazás a megoldás; néha egy átláthatóbb folyamat is sokat számít.</p></template>
<template id="story-digital"><p class="story-kicker">03 / ÖTLETEK ÉS JAVASLATOK</p>
<h3>Ötleteljünk együtt!</h3>
<p>Lehet, hogy van valami, ami szerinted feleslegesen bonyolult az egyetemen. Vagy lenne egy ötleted, amivel könnyebb lenne a hallgatók dolga. Ezeket szeretném meghallgatni.</p>
<p>Nem kell kész tervvel jelentkezni. Egy konkrét észrevételből is el lehet indulni, és közösen kideríthetjük, mi valósítható meg belőle.</p>
<p>Ehhez olyan visszajelzési lehetőséget tervezek, ahol akár név nélkül is lehet jelezni egy problémát, és később látható, hogy történt-e előrelépés. A részleteket a hallgatói igények alapján alakítanám ki.</p></template>
<template id="story-dialogue"><p class="story-kicker">04 / HALLGATÓI KÖZÖSSÉG</p>
<h3>Az egyetem nem csak az órákról szól</h3>
<p>Az egyetemi közösséghez nem mindenkinek ugyanolyan egyszerű kapcsolódni. Aki munka mellett tanul, levelezőre jár, vagy ritkábban van bent személyesen, annak egy programról vagy lehetőségről is könnyebb lemaradnia.</p>
<p>Jó lenne több olyan alkalom, ahol a hallgatók találkozhatnak, tapasztalatot cserélhetnek, vagy akár online is be tudnak kapcsolódni.</p>
<p>Engem főleg a szakmai beszélgetések, a hallgatók közötti segítségnyújtás és a közösen szervezett, valóban érdekes programok foglalkoztatnak. Hogy pontosan mire lenne igény, azt érdemes közösen eldönteni.</p></template>
<template id="story-priorities"><p class="story-kicker">05 / E-HÖK</p>
<h3>Egyszerűbb, követhető ügyintézés</h3>
<p>Az eHÖK egy tervezett digitális felület, amely a hallgatók és a HÖK közötti ügyintézést segíthetné. Az elképzelés egyszerű: egy helyen lehessen kérdést, javaslatot vagy problémát beküldeni.</p>
<p>A bejelentéshez tartozna egy követhető állapot, így később is meg lehetne nézni, foglalkoznak-e már vele. Az anonim visszajelzés lehetőségét is szeretném beépíteni.</p>
<p>A rendszer még fejlesztési koncepció, nem működő egyetemi szolgáltatás. A következő lépés annak egyeztetése, mire van tényleges igény, és milyen működési, illetve adatvédelmi feltételekkel lehetne bevezetni.</p></template>
